<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevMayCry Quiz</title>
<meta name="description" content="Test what you learned from DevMayCry posts. Got one wrong? The quiz explains why.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1a33; --navy-2:#0f2444; --ink:#070f1f; --line:#2b4775;
  --text:#eef3fb; --soft:#c8d6ee; --blue:#8fb4f0; --gold:#f5c518;
  --green:#7ce3a6; --orange:#ff8a4c;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--text);font:400 17px/1.5 var(--sans);
  background-color:var(--navy);
  background-image:linear-gradient(rgba(143,180,240,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(143,180,240,.05) 1px,transparent 1px);
  background-size:36px 36px;
}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
.logo{font:400 28px/1 "Kaushan Script",cursive;color:var(--gold);text-decoration:none}
.top{display:flex;align-items:center;gap:10px}
.lang{font:700 14px/1 var(--mono);color:var(--gold);text-decoration:none;padding:8px 2px}
.pill{font:400 14px/1 var(--mono);color:var(--blue);border:2px solid var(--line);border-radius:99px;padding:8px 14px;white-space:nowrap}
h1{font-size:clamp(44px,12vw,72px);line-height:.98;letter-spacing:-.03em;margin:0 0 12px}
h2{font-size:clamp(24px,5.4vw,32px);line-height:1.18;letter-spacing:-.015em;margin:0 0 20px}
p{margin:0 0 16px}
.comment{font:400 15px/1.5 var(--mono);color:var(--gold);margin:0 0 8px}
.lead{color:var(--soft);font-size:19px;max-width:32em}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* A escada: sobe a cada acerto, como o limite de um cartão novo. */
.stairs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:112px;margin:0 0 28px;padding:0 0 26px;position:relative;border-bottom:2px solid var(--line)}
.step{position:relative;height:var(--h,6%);min-height:6px;border-radius:4px 4px 0 0;background:var(--navy-2);border:2px solid var(--line);border-bottom:0;transition:height .45s cubic-bezier(.2,.9,.3,1.2),background-color .2s}
.step::after{content:attr(data-day);position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);font:400 12px/1 var(--mono);color:var(--blue)}
.step.ok{background:var(--blue);border-color:var(--blue)}
.step.bad{background:var(--orange);border-color:var(--orange)}
.step.now{border-color:var(--gold);border-style:dashed}
.step.peak{background:var(--gold);border-color:var(--gold);box-shadow:0 0 22px rgba(245,197,24,.55)}
.stairs.big{height:190px}

.options{display:grid;gap:10px;margin:0 0 20px}
.opt{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;font:500 17px/1.4 var(--sans);color:var(--text);background:var(--ink);border:2px solid var(--line);border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default;opacity:.55}
.opt .key{font:400 14px/1.7 var(--mono);color:var(--blue);flex:none}
.opt.right{border-color:var(--green);opacity:1}
.opt.wrong{border-color:var(--orange);opacity:1}

.term{background:var(--ink);border:2px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 20px}
.term.good{border-color:var(--green)}
.term.miss{border-color:var(--orange)}
.term .bar{display:flex;gap:7px;padding:11px 14px;border-bottom:2px solid var(--line)}
.term .bar i{width:10px;height:10px;border-radius:50%;background:#34507f}
.term .body{padding:16px}
.term h3{font:700 18px/1.3 var(--mono);margin:0 0 10px}
.term.good h3{color:var(--green)} .term.miss h3{color:var(--orange)}
.term p:last-child{margin-bottom:0}
.src{font:400 14px/1.5 var(--mono)}

.btn{display:inline-block;width:100%;padding:15px 20px;font:700 18px/1.2 var(--sans);color:var(--ink);background:var(--gold);border:2px solid var(--gold);border-radius:10px;cursor:pointer;text-align:center;text-decoration:none}
.btn:hover{background:#ffd93b}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line);margin-bottom:10px}
.btn + .btn.ghost{margin-top:10px}
.btn.ghost:hover{border-color:var(--blue);background:transparent}
.list{display:grid;gap:10px;margin:0 0 20px}
.score{font:700 clamp(56px,16vw,88px)/1 var(--sans);letter-spacing:-.03em;margin:0 0 4px}
.score small{font-size:.42em;color:var(--blue);font-weight:500;letter-spacing:0}
.review h3{font:500 17px/1.4 var(--sans);color:var(--text);margin:0 0 10px}
.review .fix{color:var(--green);font:400 15px/1.5 var(--mono);margin:0 0 8px}
footer{margin-top:32px;font:400 14px/1.6 var(--mono);color:var(--blue)}
.social{display:flex;flex-wrap:wrap;gap:8px 24px}
.social a{display:inline-block;padding:6px 0}
@media (prefers-reduced-motion:reduce){.step{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="./">DevMayCry</a>
    <div class="top">
      <span class="pill" id="pill" aria-live="polite"></span>
      <a class="lang" href="../" hreflang="pt-BR" lang="pt-BR" aria-label="Jogar em português">PT</a>
    </div>
  </header>
  <main id="app"></main>
  <footer>
    <nav class="social" aria-label="DevMayCry on social media">
      <a href="https://www.instagram.com/_devmaycry/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.threads.com/@_devmaycry" target="_blank" rel="noopener">Threads</a>
      <a href="https://x.com/_devmaycry" target="_blank" rel="noopener">X</a>
      <a href="https://www.tiktok.com/@devmaycry_" target="_blank" rel="noopener">TikTok</a>
    </nav>
  </footer>
</div>

<script>
/* ==========================================================================
   COMO ADICIONAR UM POST NOVO
   Copie um bloco dentro de POSTS e troque o conteúdo.
   - id: vira o link direto, por exemplo index.html?post=ip-warmup
   - questions: use 7 perguntas, uma para cada dia da escada
   - links: cole o link do post em cada rede; link vazio não aparece no jogo
   - options: uma opção com ok:true; todas precisam de "why", a explicação
   - toda pergunta deve ter sido ensinada no post: não use fatos que ficaram de fora
   O código abaixo de POSTS não precisa mudar.
   ========================================================================== */
const SRC = {
  resendWarm: {label:'Resend: warm-up guide', url:'https://resend.com/docs/knowledge-base/warming-up'},
  resendIp:   {label:'Resend: how dedicated IPs work', url:'https://resend.com/docs/knowledge-base/how-do-dedicated-ips-work'},
  aws:        {label:'AWS SES: warming up dedicated IPs', url:'https://docs.aws.amazon.com/ses/latest/dg/dedicated-ip-warming.html'},
  yahoo:      {label:'Yahoo Sender Hub', url:'https://senders.yahooinc.com/best-practices'}
};

const POSTS = [
  {
    id: 'ip-warmup',
    title: 'IP Warmup',
    hook: 'Like a new card, a new IP starts small. Get through 7 days of warmup and see how high your reputation climbs.',
    links: {
      linkedin: '',
      dailydev: ''
    },
    questions: [
      {
        q: 'A store changed its IP and wants to send 50,000 emails today. What do you do?',
        source: SRC.aws,
        options: [
          {ok:true, t:'Increase volume in steps, over several days', why:'The provider does not know this IP yet. Growing slowly builds history, like using a new card without maxing it out.'},
          {t:'Send everything today to make the most of the campaign', why:'A spike from an IP with no history worries providers. Your emails may get limited or blocked.'},
          {t:'Send everything overnight, when there is less traffic', why:'The time of day does not fix this. Providers look at volume and history, and 50,000 emails from a new IP is still a spike.'}
        ]
      },
      {
        q: 'Why does a new IP need a warmup?',
        source: SRC.aws,
        options: [
          {ok:true, t:'It has no history, so providers do not trust it yet', why:'Without history, providers cannot tell if a sender is reliable. That is why they accept less email from new IPs.'},
          {t:'It sends emails more slowly', why:'Speed is not the issue. Providers limit delivery because they do not trust the IP yet.'},
          {t:'DNS has not finished propagating', why:'DNS is a different topic. Warmup exists to build reputation, not to wait for a setting to update.'}
        ]
      },
      {
        q: 'Who do you email first during a warmup?',
        source: SRC.aws,
        options: [
          {ok:true, t:'People who engage with your emails the most', why:'Engaged people complain less, so your complaint rate stays low as volume grows.'},
          {t:'Your whole list, all at once', why:'That creates the spike a warmup tries to avoid, and it includes people who may mark you as spam.'},
          {t:'Old, inactive contacts', why:'Inactive contacts are more likely to bounce or complain. Leave them for later, or clean your list.'}
        ]
      },
      {
        q: 'During a warmup, what spam limit does the Resend guide use as a reference?',
        source: SRC.resendWarm,
        options: [
          {ok:true, t:'Below 0.08%', why:'The guide uses 0.08% spam as its reference. If the rate rises, it is time to slow down.'},
          {t:'Below 4%', why:'4% is the reference for bounces, not spam. The spam limit is much lower: 0.08%.'},
          {t:'Below 1%', why:'1% is more than ten times the guide’s reference. The spam limit is 0.08%.'}
        ]
      },
      {
        q: 'What does a dedicated IP need to stay warm?',
        source: SRC.resendIp,
        options: [
          {ok:true, t:'Constant sending volume', why:'A dedicated IP is only yours. Without constant sending it cools down, like a card you barely use.'},
          {t:'Only the first warmup, once', why:'A warmup does not last forever. After it, the IP still needs constant sending.'},
          {t:'Big sends every now and then', why:'Sudden volume changes hurt IP reputation. Consistency is what keeps it warm.'}
        ]
      },
      {
        q: 'Your spam rate went up during the warmup. What do you do?',
        source: SRC.resendWarm,
        options: [
          {ok:true, t:'Slow down and find the cause', why:'This is the signal that the plan needs to slow down. The Resend guide uses bounces below 4% and spam below 0.08% as its reference.'},
          {t:'Send more to dilute the rate', why:'More volume to the same bad list means more complaints, so providers see a bigger problem.'},
          {t:'Switch IPs and keep the same pace', why:'The cause is still there. You would lose the IP history and take the same problem to the new one.'}
        ]
      },
      {
        q: 'Your domain has a bad reputation. Will a new IP fix it?',
        source: SRC.yahoo,
        options: [
          {ok:true, t:'No, your domain reputation goes with you', why:'IP and domain reputations are separate, and the domain follows your brand on any IP. Providers give it a lot of weight today.'},
          {t:'Yes, a new IP means a fresh start', why:'Only the IP starts fresh. The domain stays the same, with the same bad history.'},
          {t:'Yes, as long as it is a dedicated IP', why:'Having your own IP does not erase the domain history. You need to fix the cause, such as a bad list or complaints.'}
        ]
      }
    ],
    ranks: [
      {min:7, title:'Inbox', text:'Top reputation. You know how to warm up an IP from start to finish.'},
      {min:5, title:'Warmed-up IP', text:'Your reputation climbed well. Review your mistakes below to reach 7.'},
      {min:3, title:'Limited delivery', text:'Some of your emails got through. Read the explanations and try again.'},
      {min:0, title:'Blocked IP', text:'The provider did not trust you this time. The explanations below show the way.'}
    ]
  }
];

/* ---------- Motor do jogo ---------- */
const NETWORKS = {linkedin:'LinkedIn', dailydev:'daily.dev'};
const app = document.getElementById('app');
const pill = document.getElementById('pill');
const params = new URLSearchParams(location.search);
let post, day, answers;

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (k === 'class') n.className = v;
    else if (k === 'on') n.addEventListener('click', v);
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
}
const shuffle = a => {
  const c = [...a];
  for (let i = c.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c;
};
function store(key, value){
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
  } catch (e) { return null; }
}
function show(...nodes){
  app.replaceChildren(...nodes.flat().filter(n => n != null));
  window.scrollTo(0, 0);
}

function stairs(big){
  const total = post.questions.length;
  const box = el('div', {class:'stairs' + (big ? ' big' : ''), role:'img',
    'aria-label': answers.filter(a => a.ok).length + ' correct out of ' + answers.length + ' days answered'});
  let score = 0;
  for (let i = 0; i < total; i++){
    const a = answers[i];
    if (a && a.ok) score++;
    const h = a ? 8 + (score / total) * 92 : 6;
    const peak = big && a && a.ok && score === total;
    const cls = 'step' + (a ? (a.ok ? ' ok' : ' bad') : '') + (i === day && !a ? ' now' : '') + (peak ? ' peak' : '');
    box.append(el('div', {class:cls, 'data-day':'d' + (i + 1), style:'--h:' + h + '%'}));
  }
  return box;
}

function home(){
  pill.textContent = 'quiz';
  show(
    el('h1', {}, 'DevMayCry Quiz'),
    el('p', {class:'lead'}, 'Pick a post and see if you got it. Got one wrong? The quiz explains why.'),
    el('div', {class:'list'}, POSTS.map(p =>
      el('a', {class:'btn ghost', href:'?post=' + encodeURIComponent(p.id)}, p.title)))
  );
}

function start(){
  day = 0; answers = [];
  pill.textContent = post.title.toLowerCase();
  const best = store('dmc-best-' + post.id);
  show(
    el('p', {class:'comment'}, '// post quiz'),
    el('h1', {}, post.title),
    el('p', {class:'lead'}, post.hook),
    stairs(false),
    best !== null ? el('p', {class:'src'}, 'Your best: ' + best + ' of ' + post.questions.length) : null,
    el('button', {class:'btn', type:'button', on:ask}, 'Start day 1')
  );
}

function ask(){
  const q = post.questions[day];
  pill.textContent = 'day ' + (day + 1) + ' of ' + post.questions.length;
  const opts = shuffle(q.options);
  const list = el('div', {class:'options'}, opts.map((o, i) =>
    el('button', {class:'opt', type:'button', on:() => answer(q, o, opts, list)},
      el('span', {class:'key', 'aria-hidden':'true'}, String(i + 1)), el('span', {}, o.t))));
  show(stairs(false), el('h2', {}, q.q), list);
  list.querySelector('button').focus({preventScroll:true});
}

function answer(q, chosen, opts, list){
  if (answers[day]) return;
  const right = q.options.find(o => o.ok);
  answers[day] = {ok: !!chosen.ok, q, chosen, right};
  [...list.children].forEach((b, i) => {
    b.disabled = true;
    if (opts[i].ok) b.classList.add('right');
    else if (opts[i] === chosen) b.classList.add('wrong');
  });
  const last = day === post.questions.length - 1;
  const next = el('button', {class:'btn', type:'button', on:() => {
    day++;
    last ? result() : ask();
  }}, last ? 'See my result' : 'Go to day ' + (day + 2));

  const body = el('div', {class:'body'},
    el('h3', {tabindex:'-1'}, chosen.ok ? 'Correct. Your reputation went up.' : 'Not this time.'),
    chosen.ok ? null : el('p', {}, chosen.why),
    chosen.ok ? null : el('p', {class:'comment'}, '// correct answer: ' + right.t),
    el('p', {}, right.why),
    el('p', {class:'src'}, 'Source: ', el('a', {href:q.source.url, target:'_blank', rel:'noopener'}, q.source.label))
  );
  const box = el('div', {class:'term ' + (chosen.ok ? 'good' : 'miss'), role:'status'},
    el('div', {class:'bar', 'aria-hidden':'true'}, el('i'), el('i'), el('i')), body);
  const fresh = stairs(false);
  app.querySelector('.stairs').replaceWith(fresh);
  const bar = fresh.children[day], height = bar.style.getPropertyValue('--h');
  bar.style.setProperty('--h', '6%');
  requestAnimationFrame(() => requestAnimationFrame(() => bar.style.setProperty('--h', height)));
  app.append(box, next);
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
  body.querySelector('h3').focus({preventScroll:true});
}

function result(){
  const total = post.questions.length;
  const score = answers.filter(a => a.ok).length;
  const rank = post.ranks.find(r => score >= r.min);
  const prev = Number(store('dmc-best-' + post.id) || 0);
  if (score > prev || store('dmc-best-' + post.id) === null) store('dmc-best-' + post.id, score);
  pill.textContent = 'result';
  const misses = answers.filter(a => !a.ok);
  const url = location.origin + location.pathname + '?post=' + encodeURIComponent(post.id);
  const msg = 'I got ' + score + ' of ' + total + ' on the ' + post.title + ' quiz by @_devmaycry. Can you beat it?';
  const share = el('button', {class:'btn ghost', type:'button', on: async () => {
    try {
      if (navigator.share) await navigator.share({text:msg, url});
      else { await navigator.clipboard.writeText(msg + ' ' + url); share.textContent = 'Link copied'; }
    } catch (e) { /* a pessoa cancelou o compartilhamento */ }
  }}, 'Challenge a friend');
  show(
    stairs(true),
    el('p', {class:'score'}, String(score), el('small', {}, ' of ' + total)),
    el('h2', {}, rank.title),
    el('p', {class:'lead'}, rank.text),
    misses.length ? el('h2', {}, 'Why you got these wrong') : null,
    misses.map(m => el('div', {class:'term miss review'},
      el('div', {class:'body'},
        el('h3', {}, m.q.q),
        el('p', {}, 'You chose: ' + m.chosen.t + '. ' + m.chosen.why),
        el('p', {class:'fix'}, '// correct: ' + m.right.t),
        el('p', {}, m.right.why)))),
    Object.entries(post.links || {}).filter(([, href]) => href).map(([net, href]) =>
      el('a', {class:'btn ghost', href, target:'_blank', rel:'noopener'}, 'Review the post on ' + NETWORKS[net])),
    el('button', {class:'btn', type:'button', on:start}, 'Play again'),
    share
  );
}

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const b = document.querySelectorAll('.opt:not(:disabled)')[Number(e.key) - 1];
  if (b) b.click();
});

const wanted = params.get('post');
post = POSTS.find(p => p.id === wanted) || (POSTS.length === 1 ? POSTS[0] : null);
post ? start() : home();
</script>
</body>
</html>
